<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo Wiki | Mosaico Pro</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --html: #ef4444; --css: #3b82f6; --js: #eab308;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        
        .header-section { text-align: center; margin-bottom: 30px; }
        .search-bar { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: var(--card); color: white; font-size: 1rem; margin-bottom: 20px; outline: none; }

        /* ESTILO DE LOS MENÚS DESPLEGABLES */
        details {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            transition: all 0.3s ease;
        }
        details[open] {
            background: rgba(30, 41, 59, 1);
            padding-bottom: 15px;
        }
        summary {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            outline: none;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after {
            content: '▶';
            font-size: 0.8rem;
            transition: transform 0.3s;
        }
        details[open] summary::after { transform: rotate(90deg); }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
            padding: 0 20px; /* Margen interno para que los tiles no toquen el borde */
        }

        /* TILES (Mismo diseño Pro que hiciste) */
        .tile {
            background: var(--bg); /* Fondo un poco más oscuro que el contenedor */
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #334155;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .tile:hover { transform: scale(1.05); border-color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 10; }
        .tile code { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .tile span { font-size: 0.75rem; opacity: 0.8; line-height: 1.2; }

        .html-t { border-bottom: 5px solid var(--html); }
        .css-t { border-bottom: 5px solid var(--css); }
        .js-t { border-bottom: 5px solid var(--js); }

        /* MODAL (Sin cambios) */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center;
            justify-content: center; z-index: 2000; padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e293b; width: 100%; max-width: 500px;
            border-radius: 20px; padding: 30px; position: relative;
            border: 1px solid #475569; animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 2rem; color: #94a3b8; }
        .example-box {
            background: #0f172a; padding: 20px; border-radius: 12px;
            margin-top: 20px; color: #38bdf8; font-family: 'Fira Code', monospace;
            white-space: pre-wrap; border: 1px solid #334155; font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>LOBO WIKI 🐺</h1>
        <input type="text" id="search" class="search-bar" placeholder="🔍 Buscar etiquetas o funciones...">
    </div>

    <details open>
        <summary style="color: var(--html);">🧱 HTML (Estructura)</summary>
        <div class="grid" id="html-grid"></div>
    </details>

    <details>
        <summary style="color: var(--css);">🎨 CSS (Diseño)</summary>
        <div class="grid" id="css-grid"></div>
    </details>

    <details>
        <summary style="color: var(--js);">⚡ JS (Lógica)</summary>
        <div class="grid" id="js-grid"></div>
    </details>
</div>

<div class="modal" id="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h3 id="m-title" style="margin-top: 0; font-size: 1.5rem; color: #fff;"></h3>
        <p id="m-desc" style="font-size: 1rem; color: #94a3b8; margin-bottom: 20px;"></p>
        <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 5px;">EJEMPLO PRÁCTICO:</div>
        <div class="example-box" id="m-code"></div>
    </div>
</div>

<script>
    // Tu lógica se mantiene intacta para que no falle nada
    const data = {
        html: [
            { t: "div", d: "Caja contenedora principal.", e: "<div>\n  <h1>Hola</h1>\n</div>" },
            { t: "a", d: "Enlace o hipervínculo.", e: '<a href="https://google.com">Ir a Google</a>' },
            { t: "img", d: "Inserta una imagen.", e: '<img src="lobo.png" alt="Lobo">' },
            { t: "button", d: "Botón para acciones.", e: '<button onclick="saludar()">Click</button>' }
        ],
        css: [
            { t: "color", d: "Cambia el color de la letra.", e: "h1 {\n  color: #ef4444;\n}" },
            { t: "display: flex", d: "Alineación flexible.", e: ".padre {\n  display: flex;\n}" },
            { t: "border-radius", d: "Esquinas redondeadas.", e: ".boton {\n  border-radius: 12px;\n}" }
        ],
        js: [
            { t: "alert()", d: "Muestra mensaje de alerta.", e: "alert('¡Hola Lobo!');" },
            { t: "querySelector()", d: "Selecciona un elemento HTML.", e: "const t = document.querySelector('h1');" },
            { t: "Math.random()", d: "Genera número aleatorio.", e: "let n = Math.random();" }
        ]
    };

    function render() {
        const fill = (id, items, cls) => {
            document.getElementById(id).innerHTML = items.map(i => `
                <div class="tile ${cls}-t" onclick="showExample('${i.t}', '${i.d}', \`${i.e}\`)">
                    <code>${i.t}</code>
                    <span>${i.d}</span>
                </div>
            `).join('');
        };
        fill('html-grid', data.html, 'html');
        fill('css-grid', data.css, 'css');
        fill('js-grid', data.js, 'js');
    }

    function showExample(title, desc, example) {
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = desc;
        document.getElementById('m-code').innerText = example;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    // Mejoramos el buscador para que abra los menús si encuentra algo
    document.getElementById('search').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('details').forEach(det => {
            const hasMatch = det.innerText.toLowerCase().includes(val);
            if (val.length > 0 && hasMatch) det.open = true;
        });
        document.querySelectorAll('.tile').forEach(t => {
            t.style.display = t.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    };

    render();
</script>
</body>
</html>
