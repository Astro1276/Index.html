<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo Wiki | Versión Blindada</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --html: #ef4444; --css: #3b82f6; --js: #eab308;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        
        .header-section { text-align: center; margin-bottom: 30px; }
        .search-bar { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: var(--card); color: white; font-size: 1rem; margin-bottom: 20px; outline: none; }

        details { background: rgba(30, 41, 59, 0.5); border-radius: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        summary { padding: 20px; font-size: 1.2rem; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: '▶'; font-size: 0.8rem; transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(90deg); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; }

        .tile {
            background: var(--bg); aspect-ratio: 1 / 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 15px;
            cursor: pointer; transition: all 0.3s; border: 1px solid #334155;
            text-align: center; padding: 15px; box-sizing: border-box;
        }
        .tile:hover { transform: scale(1.05); border-color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .tile b { font-size: 1.1rem; color: #fff; margin-bottom: 5px; display: block; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .tile span { font-size: 0.75rem; opacity: 0.8; line-height: 1.2; }

        .html-t { border-bottom: 5px solid var(--html); }
        .css-t { border-bottom: 5px solid var(--css); }
        .js-t { border-bottom: 5px solid var(--js); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; width: 100%; max-width: 500px; border-radius: 20px; padding: 30px; position: relative; border: 1px solid #475569; }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 2rem; color: #94a3b8; }
        .example-box { background: #0f172a; padding: 20px; border-radius: 12px; margin-top: 15px; color: #38bdf8; font-family: monospace; white-space: pre-wrap; border: 1px solid #334155; overflow-x: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>LOBO WIKI 🐺</h1>
        <input type="text" id="search" class="search-bar" placeholder="🔍 Buscar etiqueta o propiedad...">
    </div>

    <details open>
        <summary style="color: var(--html);">🧱 HTML (Estructura Avanzada)</summary>
        <div class="grid" id="html-grid"></div>
    </details>

    <details>
        <summary style="color: var(--css);">🎨 CSS (Estilos Modernos)</summary>
        <div class="grid" id="css-grid"></div>
    </details>

    <details>
        <summary style="color: var(--js);">⚡ JS (Lógica y API)</summary>
        <div class="grid" id="js-grid"></div>
    </details>
</div>

<div class="modal" id="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h3 id="m-title" style="margin:0; color:#fff;"></h3>
        <p id="m-desc" style="color:#94a3b8;"></p>
        <div class="example-box" id="m-code"></div>
    </div>
</div>

<script>

            { t: "main", d: "Contenido principal único.", e: "<main>\n  ...\n</main>" },
            { t: "section", d: "Sección temática.", e: "<section>\n  <h2>Título</h2>\n</section>" },
            { t: "article", d: "Contenido independiente.", e: "<article>\n  <h3>Post</h3>\n</article>" },
            { t: "aside", d: "Contenido tangencial (sidebar).", e: "<aside>\n  <p>Publicidad</p>\n</aside>" },
            { t: "nav", d: "Enlaces de navegación.", e: "<nav>\n  <a href='#'>Link</a>\n</nav>" },
            { t: "header", d: "Cabecera de sección.", e: "<header>\n  <h1>Marca</h1>\n</header>" },
            { t: "footer", d: "Pie de página.", e: "<footer>\n  <p>© 2024</p>\n</footer>" },
            { t: "div", d: "Contenedor de bloque.", e: "<div>...</div>" },

            { t: "a", d: "Hipervínculo.", e: "<a href='url'>Texto</a>" },
            { t: "img", d: "Imagen con texto alternativo.", e: "<img src='f.jpg' alt='Lobo'>" },
            { t: "ul", d: "Lista desordenada.", e: "<ul>\n  <li>Item</li>\n</ul>" },
            { t: "ol", d: "Lista ordenada.", e: "<ol>\n  <li>Primero</li>\n</ol>" },
            { t: "table", d: "Estructura de tabla.", e: "<table>\n  <tr><td>Dato</td></tr>\n</table>" },
            { t: "form", d: "Área de formulario.", e: "<form action='' method='POST'>\n  ...\n</form>" },
            { t: "input", d: "Campo de entrada.", e: "<input type='text' placeholder='...'>" },
            { t: "button", d: "Botón ejecutable.", e: "<button>Click</button>" },
            { t: "textarea", d: "Entrada de texto largo.", e: "<textarea></textarea>" },
            { t: "select", d: "Lista desplegable.", e: "<select>\n  <option>1</option>\n</select>" },
            { t: "video", d: "Incrustar video.", e: "<video controls src='v.mp4'></video>" },
            { t: "audio", d: "Incrustar audio.", e: "<audio controls src='a.mp3'></audio>" },
            { t: "canvas", d: "Gráficos por script.", e: "<canvas id='miCanvas'></canvas>" },
            { t: "iframe", d: "Incrustar otra web.", e: "<iframe src='url'></iframe>" },
            { t: "details", d: "Contenido desplegable.", e: "<details>\n  <summary>Clic</summary>\n  Info\n</details>" },
            { t: "template", d: "Contenido oculto para JS.", e: "<template id='temp'>\n  <p>Copiame</p>\n</template>" },
            { t: "blockquote", d: "Cita extensa.", e: "<blockquote>\n  Frase celebre\n</blockquote>" },
            { t: "code", d: "Fragmento de código.", e: "<code>const x = 0;</code>" },
            { t: "picture", d: "Imágenes adaptativas.", e: "<picture>\n  <source srcset='...'>\n  <img>\n</picture>" },
            { t: "dialog", d: "Cuadro de diálogo (Modal).", e: "<dialog open>\n  Es un modal nativo\n</dialog>" }
        ],

            { t: "flex-direction", d: "Eje principal de flex.", e: "div {\n  flex-direction: column;\n}" },

            { t: "position", d: "Método de posicionamiento.", e: "div {\n  position: absolute | relative | fixed | sticky;\n}" },
            { t: "z-index", d: "Orden de capas (profundidad).", e: "div {\n  z-index: 10;\n}" },
            { t: "background-image", d: "Imagen de fondo.", e: "div {\n  background-image: url('f.png');\n}" },
            { t: "box-shadow", d: "Sombra del elemento.", e: "div {\n  box-shadow: 0 4px 10px rgba(0,0,0,0.5);\n}" },
            { t: "border-radius", d: "Esquinas redondeadas.", e: "div {\n  border-radius: 50%;\n}" },
            { t: "transition", d: "Animación de cambios.", e: "div {\n  transition: all 0.3s ease;\n}" },
            { t: "transform", d: "Modificar forma/lugar.", e: "div {\n  transform: scale(1.1) rotate(5deg);\n}" },
            { t: "animation", d: "Keyframes personalizados.", e: "@keyframes f {\n  to { opacity: 0; }\n}\ndiv { animation: f 2s; }" },
            { t: "opacity", d: "Nivel de transparencia.", e: "div {\n  opacity: 0.5;\n}" },
            { t: "backdrop-filter", d: "Efecto blur en fondo.", e: "div {\n  backdrop-filter: blur(10px);\n}" },
            { t: "aspect-ratio", d: "Relación de aspecto.", e: "div {\n  aspect-ratio: 16 / 9;\n}" },
            { t: "user-select", d: "Controlar selección de texto.", e: "div {\n  user-select: none;\n}" },
            { t: "overflow", d: "Control de contenido extra.", e: "div {\n  overflow: hidden | scroll | auto;\n}" },
            { t: "cursor", d: "Estilo del puntero.", e: "div {\n  cursor: pointer | grab | help;\n}" }
        ],
        js: [
            { t: "const / let", d: "Declaración de variables.", e: "const id = 1;\nlet nombre = 'Lobo';" },
            { t: "querySelector", d: "Seleccionar por CSS.", e: "const el = document.querySelector('.clase');" },
            { t: "addEventListener", d: "Manejar eventos.", e: "el.addEventListener('click', (e) => {\n  console.log('Click!');\n});" },
            { t: "fetch", d: "Consumo de API.", e: "fetch(url)\n  .then(res => res.json())\n  .then(data => console.log(data));" },
            { t: "async / await", d: "Asincronía moderna.", e: "async function getData() {\n  const res = await fetch(url);\n  const data = await res.json();\n}" },

            { t: "classList", d: "Manipular clases.", e: "el.classList.add('active');\nel.classList.toggle('hidden');" },
            { t: "map", d: "Transformar arrays.", e: "const doble = nums.map(n => n * 2);" },
            { t: "filter", d: "Filtrar arrays.", e: "const pares = nums.filter(n => n % 2 === 0);" },
            { t: "forEach", d: "Recorrer elementos.", e: "items.forEach(i => console.log(i));" },
            { t: "JSON.stringify", d: "Objeto a Texto.", e: "const txt = JSON.stringify({id: 1});" },
            { t: "setTimeout", d: "Ejecución diferida.", e: "setTimeout(() => {\n  alert('Time!');\n}, 2000);" },
            { t: "setInterval", d: "Ejecución en bucle.", e: "setInterval(() => {\n  console.log('Tic');\n}, 1000);" },
            { t: "Math.random", d: "Número aleatorio.", e: "const r = Math.floor(Math.random() * 100);" },
            { t: "Array.from", d: "Crear array de objeto iterable.", e: "const divs = Array.from(document.querySelectorAll('div'));" },
            { t: "try...catch", d: "Manejo de errores.", e: "try {\n  codigoPeligroso();\n} catch(err) {\n  console.error(err);\n}" }
        ]
    };

    function render() {
        const createGrid = (id, list, type) => {
            const container = document.getElementById(id);
            container.innerHTML = ""; 
            
            list.forEach(item => {
                const tile = document.createElement("div");
                tile.className = `tile ${type}-t`;
                
                const title = document.createElement("b");
                title.innerText = item.t;
                
                const desc = document.createElement("span");
                desc.innerText = item.d;
                
                tile.appendChild(title);
                tile.appendChild(desc);
                
                tile.addEventListener('click', () => {
                    showModal(item.t, item.d, item.e);
                });
                
                container.appendChild(tile);
            });
        };

        createGrid('html-grid', wikiData.html, 'html');
        createGrid('css-grid', wikiData.css, 'css');
        createGrid('js-grid', wikiData.js, 'js');
    }

    function showModal(title, desc, code) {
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = desc;
        document.getElementById('m-code').innerText = code;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    document.getElementById('search').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('details').forEach(det => {
            const hasMatch = det.innerText.toLowerCase().includes(val);
            if (val.length > 0 && hasMatch) det.open = true;
        });
        document.querySelectorAll('.tile').forEach(t => {
            t.style.display = t.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    };

    render();
</script>
</body>
</html>
