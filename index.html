<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo Wiki | Mosaico Pro</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --html: #ef4444; --css: #3b82f6; --js: #eab308;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        
        .header-section { text-align: center; margin-bottom: 30px; }
        .search-bar { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: var(--card); color: white; font-size: 1rem; margin-bottom: 20px; }

        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 40px; font-size: 1.2rem; }

        /* GRID DE MOSAICO */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 15px; }

        /* CUADRITOS (TILES) */
        .tile {
            background: var(--card);
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
            text-align: center;
            padding: 10px;
        }
        .tile:hover { transform: scale(1.05); border-color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .tile code { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .tile span { font-size: 0.7rem; opacity: 0.7; }

        /* COLORES DE TILES */
        .html-t { border-bottom: 4px solid var(--html); }
        .css-t { border-bottom: 4px solid var(--css); }
        .js-t { border-bottom: 4px solid var(--js); }

        /* VENTANA MODAL (EL EJEMPLO) */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center;
            justify-content: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: #1e293b; width: 100%; max-width: 500px;
            border-radius: 15px; padding: 25px; position: relative;
            border: 1px solid #475569; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .close-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 1.5rem; }
        
        .example-box {
            background: #0f172a; padding: 15px; border-radius: 8px;
            margin-top: 15px; color: #38bdf8; font-family: monospace;
            white-space: pre-wrap; border: 1px solid #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>LOBO WIKI 🐺</h1>
        <input type="text" id="search" class="search-bar" placeholder="Busca etiquetas o funciones...">
    </div>

    <h2 style="color: var(--html);">🧱 ESTRUCTURA (HTML)</h2>
    <div class="grid" id="html-grid"></div>

    <h2 style="color: var(--css);">🎨 DISEÑO (CSS)</h2>
    <div class="grid" id="css-grid"></div>

    <h2 style="color: var(--js);">⚡ LÓGICA (JS)</h2>
    <div class="grid" id="js-grid"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h3 id="m-title" style="margin-top: 0;"></h3>
        <p id="m-desc" style="font-size: 0.9rem; color: #94a3b8;"></p>
        <div class="example-box" id="m-code"></div>
    </div>
</div>

<script>
    const data = {
        html: [
            { t: "<div>", d: "Caja contenedora.", e: "<div>\n  <p>Contenido</p>\n</div>" },
            { t: "<a>", d: "Enlace web.", e: '<a href="https://google.com">Ir a Google</a>' },
            { t: "<img>", d: "Imagen.", e: '<img src="lobo.jpg" alt="Lobo">' },
            { t: "<button>", d: "Botón interactivo.", e: '<button onclick="alert()">Click</button>' }
        ],
        css: [
            { t: "color", d: "Cambia el color del texto.", e: "p {\n  color: red;\n}" },
            { t: "display: flex", d: "Alineación flexible.", e: ".caja {\n  display: flex;\n  justify-content: center;\n}" },
            { t: "border-radius", d: "Esquinas redondeadas.", e: "div {\n  border-radius: 50%;\n}" }
        ],
        js: [
            { t: "alert()", d: "Muestra alerta.", e: "alert('¡Hola Lobo!');" },
            { t: "querySelector()", d: "Selecciona HTML.", e: "const b = document.querySelector('button');" },
            { t: "math.random()", d: "Número aleatorio.", e: "let n = Math.random() * 10;" }
        ]
    };

    function render() {
        const fill = (id, items, cls) => {
            document.getElementById(id).innerHTML = items.map(i => `
                <div class="tile ${cls}-t" onclick="showExample('${i.t}', '${i.d}', \`${i.e}\`)">
                    <code>${i.t}</code>
                    <span>${i.d}</span>
                </div>
            `).join('');
        };
        fill('html-grid', data.html, 'html');
        fill('css-grid', data.css, 'css');
        fill('js-grid', data.js, 'js');
    }

    function showExample(title, desc, example) {
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = desc;
        document.getElementById('m-code').innerText = example;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    // Buscador
    document.getElementById('search').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.tile').forEach(t => {
            t.style.display = t.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    };

    render();
</script>
</body>
</html>
