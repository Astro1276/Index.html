<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo Wiki - La Enciclopedia del Programador</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent-html: #ef4444;
            --accent-css: #3b82f6;
            --accent-js: #eab308;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: var(--text); letter-spacing: 2px; }
        
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: var(--card);
            color: white;
        }

        /* Estilo de los Acordeones */
        details {
            background: var(--card);
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        summary {
            padding: 15px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        summary::after { content: "▼"; font-size: 0.8rem; color: #64748b; }
        details[open] summary::after { content: "▲"; }
        
        .content {
            padding: 15px;
            border-top: 1px solid #334155;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
        }

        .tag-card {
            background: #0f172a;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }
        .tag-card code { font-weight: bold; color: white; }
        .tag-card p { margin: 5px 0 0; font-size: 0.85rem; color: #94a3b8; }

        /* Colores por Categoría */
        .html-cat { border-left-color: var(--accent-html); }
        .css-cat { border-left-color: var(--accent-css); }
        .js-cat { border-left-color: var(--accent-js); }
        
        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-left: 10px;
        }
        .bg-html { background: var(--accent-html); color: white; }
        .bg-css { background: var(--accent-css); color: white; }
        .bg-js { background: var(--accent-js); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>LOBO WIKI 🐺</h1>
    <input type="text" id="search" class="search-box" placeholder="Busca una etiqueta, propiedad o función...">

    <details open>
        <summary>🧱 HTML5 (Estructura Total) <span class="badge bg-html">Esqueleto</span></summary>
        <div class="content" id="html-list">
            </div>
    </details>

    <details>
        <summary>🎨 CSS3 (Estilos y Layout) <span class="badge bg-css">Diseño</span></summary>
        <div class="content" id="css-list">
        </div>
    </details>

    <details>
        <summary>⚡ JavaScript (Lógica y DOM) <span class="badge bg-js">Cerebro</span></summary>
        <div class="content" id="js-list">
        </div>
    </details>
</div>

<script>
    const db = {
        html: [
            { t: "<html>", d: "Raíz del documento." },
            { t: "<head>", d: "Metadatos y enlaces externos." },
            { t: "<body>", d: "Contenido visible de la web." },
            { t: "<div>", d: "Contenedor genérico en bloque." },
            { t: "<span>", d: "Contenedor genérico en línea." },
            { t: "<a>", d: "Hipervínculo a otras páginas." },
            { t: "<img>", d: "Muestra una imagen." },
            { t: "<ul> / <li>", d: "Listas desordenadas." },
            { t: "<table>", d: "Crea tablas de datos." },
            { t: "<form>", d: "Formulario para enviar datos." },
            { t: "<input>", d: "Campo de entrada de datos." },
            { t: "<header> / <footer>", d: "Secciones de cabecera y pie." }
        ],
        css: [
            { t: "display", d: "Define el tipo de caja (flex, grid, block)." },
            { t: "position", d: "Ubicación del elemento (absolute, relative, fixed)." },
            { t: "color / background", d: "Colores de letra y de fondo." },
            { t: "margin / padding", d: "Espacios externos e internos." },
            { t: "border", d: "Define el borde de un elemento." },
            { t: "width / height", d: "Dimensiones del elemento." },
            { t: "flex-direction", d: "Eje de los elementos en Flexbox." },
            { t: "grid-template-columns", d: "Define columnas en Grid." },
            { t: "z-index", d: "Orden de capas (qué está encima de qué)." },
            { t: "@keyframes", d: "Base para crear animaciones." }
        ],
        js: [
            { t: "console.log()", d: "Imprime mensajes en la consola." },
            { t: "document.querySelector()", d: "Selecciona elementos del HTML." },
            { t: "addEventListener()", d: "Escucha eventos (clicks, teclas)." },
            { t: "fetch()", d: "Peticiones a servidores o APIs." },
            { t: "if / else", d: "Condicionales de lógica." },
            { t: "for / forEach", d: "Bucles para repetir acciones." },
            { t: "setTimeout()", d: "Ejecuta código después de un tiempo." },
            { t: "localStorage", d: "Guarda datos en el navegador." },
            { t: "JSON.stringify()", d: "Convierte objetos en texto." },
            { t: "function / =>", d: "Define bloques de código reutilizables." }
        ]
    };

    function loadWiki() {
        const render = (listId, data, cat) => {
            const container = document.getElementById(listId);
            container.innerHTML = data.map(item => `
                <div class="tag-card ${cat}-cat">
                    <code>${item.t}</code>
                    <p>${item.d}</p>
                </div>
            `).join('');
        };

        render('html-list', db.html, 'html');
        render('css-list', db.css, 'css');
        render('js-list', db.js, 'js');
    }

    // Buscador en tiempo real
    document.getElementById('search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.tag-card').forEach(card => {
            const text = card.innerText.toLowerCase();
            card.style.display = text.includes(term) ? "block" : "none";
        });
    });

    loadWiki();
</script>

</body>
</html>
