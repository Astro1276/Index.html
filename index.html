<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo Wiki | Mosaico Total</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --html: #ef4444; --css: #3b82f6; --js: #eab308;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        
        .header-section { text-align: center; margin-bottom: 30px; }
        .search-bar { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: var(--card); color: white; font-size: 1rem; margin-bottom: 20px; outline: none; }

        h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 40px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
            margin-top: 15px; 
        }

        .tile {
            background: var(--card);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #334155;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .tile:hover { transform: scale(1.05); border-color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        
        .tile b { font-size: 1.1rem; color: #fff; margin-bottom: 5px; display: block; }
        .tile span { font-size: 0.75rem; opacity: 0.8; line-height: 1.2; }

        .html-t { border-bottom: 5px solid var(--html); }
        .css-t { border-bottom: 5px solid var(--css); }
        .js-t { border-bottom: 5px solid var(--js); }

        /* MODAL */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; align-items: center;
            justify-content: center; z-index: 2000; padding: 20px;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e293b; width: 100%; max-width: 500px;
            border-radius: 20px; padding: 30px; position: relative;
            border: 1px solid #475569; animation: zoom 0.2s ease-out;
        }
        @keyframes zoom { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 2rem; color: #94a3b8; }
        .example-box {
            background: #0f172a; padding: 20px; border-radius: 12px;
            margin-top: 15px; color: #38bdf8; font-family: monospace;
            white-space: pre-wrap; border: 1px solid #334155; font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>LOBO WIKI 🐺</h1>
        <input type="text" id="search" class="search-bar" placeholder="🔍 Buscar...">
    </div>

    <h2 style="color: var(--html);">🧱 HTML</h2>
    <div class="grid" id="html-grid"></div>

    <h2 style="color: var(--css);">🎨 CSS</h2>
    <div class="grid" id="css-grid"></div>

    <h2 style="color: var(--js);">⚡ JS</h2>
    <div class="grid" id="js-grid"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h3 id="m-title" style="margin-top: 0; color: #fff;"></h3>
        <p id="m-desc" style="color: #94a3b8;"></p>
        <div class="example-box" id="m-code"></div>
    </div>
</div>

<script>
    const wikiData = {
        html: [
            { t: "div", d: "Caja contenedora principal.", e: "<div>\n  <p>Contenido interno</p>\n</div>" },
            { t: "a", d: "Enlace o hipervínculo.", e: '<a href="https://google.com">Ir a la web</a>' },
            { t: "img", d: "Muestra una imagen.", e: '<img src="imagen.jpg" alt="Descripción">' },
            { t: "button", d: "Soy un Botón. 😔", e: '<button>Click aquí</button>' }
        ],
        css: [
            { t: "color", d: "Color del texto.", e: "p {\n  color: blue;\n}" },
            { t: "display: flex", d: "Diseño flexible.", e: ".caja {\n  display: flex;\n}" },
            { t: "border", d: "Borde del elemento.", e: "div {\n  border: 1px solid white;\n}" }
        ],
        js: [
            { t: "alert()", d: "Mensaje emergente.", e: "alert('Hola Lobo');" },
            { t: "console.log()", d: "Escribe en consola.", e: "console.log('Mensaje');" },
            { t: "fetch()", d: "Petición a API.", e: "fetch('url').then(res => ...);" }
        ]
    };

    function render() {
        const createGrid = (id, list, type) => {
            const container = document.getElementById(id);
            container.innerHTML = "";
            list.forEach((item, index) => {
                const tile = document.createElement("div");
                tile.className = `tile ${type}-t`;
                tile.innerHTML = `<b>${item.t}</b><span>${item.d}</span>`;
                // Al hacer clic, enviamos los datos al modal
                tile.onclick = () => showModal(item.t, item.d, item.e);
                container.appendChild(tile);
            });
        };
        createGrid('html-grid', wikiData.html, 'html');
        createGrid('css-grid', wikiData.css, 'css');
        createGrid('js-grid', wikiData.js, 'js');
    }

    function showModal(title, desc, code) {
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = desc;
        document.getElementById('m-code').innerText = code;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    document.getElementById('search').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.tile').forEach(t => {
            t.style.display = t.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    };

    render();
</script>
</body>
</html>
