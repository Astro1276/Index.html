<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa de Cumpleaños!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            color: white;
            position: relative;
        }

        /* Contenedor del Regalo */
        .gift-container {
            position: relative;
            width: 160px;
            height: 160px;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        /* La Caja (Cuerpo) */
        .box-body {
            position: absolute;
            bottom: 0;
            width: 160px;
            height: 130px;
            background: #ff4757;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Cinta Vertical de la Caja */
        .box-body::after, .box-lid::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 100%;
            background: #ffa502;
        }

        /* La Tapa */
        .box-lid {
            position: absolute;
            top: 10px;
            left: -5px;
            width: 170px;
            height: 35px;
            background: #ff6b81;
            border-radius: 4px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            z-index: 2;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left top;
        }

        /* El Lazo */
        .box-bow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 15px;
            background: #ffa502;
            border-radius: 50% 50% 0 0;
        }

        /* --- ESTADO ABIERTO (TAPA) --- */
        .gift-container.open .box-lid {
            transform: rotate(-120deg) translateY(-20px);
        }

        /* --- CONTENIDO DE FOTOS --- */
        .photo-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .photo {
            position: fixed; 
            width: 110px; 
            height: 130px;
            background: white;
            padding: 6px;
            padding-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-radius: 2px;
            left: calc(50vw - 55px);
            top: calc(50vh - 65px);
            opacity: 0;
            transform: scale(0.1);
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), 
                        top 1s cubic-bezier(0.25, 1, 0.5, 1), 
                        left 1s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.4s ease;
            z-index: 5;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        /* Cuando la caja se abre */
        .gift-container.open .photo {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- CONTENEDOR DEL TEXTO --- */
        .message-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 999; 
            width: 85%;
            pointer-events: none; 
        }

        .message {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0px 0px 10px rgba(0,0,0,0.9), 2px 2px 5px rgba(0,0,0,1);
            display: inline-block;
            white-space: pre-line;
            background: rgba(26, 26, 26, 0.4); 
            padding: 10px;
            border-radius: 10px;
        }

        /* Cursor de la máquina */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.8rem;
            background-color: #ffa502;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 0.6s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="gift-container" id="giftBox">
        <div class="box-lid">
            <div class="box-bow"></div>
        </div>
        <div class="box-body"></div>
        
        <div class="photo-container">
            <div class="photo"><img src="https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=300" alt="1"></div>
            <div class="photo"><img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300" alt="2"></div>
            <div class="photo"><img src="https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=300" alt="3"></div>
            <div class="photo"><img src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=300" alt="4"></div>
            <div class="photo"><img src="https://images.unsplash.com/photo-1504196606672-aef5c9cefc92?w=300" alt="5"></div>
            <div class="photo"><img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?w=300" alt="6"></div>
            <div class="photo"><img src="https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=300" alt="7"></div>
        </div>
    </div>

    <div class="message-container">
        <span class="message" id="typewriter"></span><span class="cursor" id="cursor"></span>
    </div>

    <script>
        const giftBox = document.getElementById('giftBox');
        const textElement = document.getElementById('typewriter');
        const cursor = document.getElementById('cursor');

        const textoSorpresa = "¡Feliz Cumpleaños, Loco! 💀🔥\n\nQue la pases criminal hoy.\n¡Disfruta tu día al máximo!";
        
        let yaAbierto = false;

        giftBox.addEventListener('click', () => {
            if (yaAbierto) return; 
            yaAbierto = true;

            // Abre la tapa inmediatamente al tocar
            giftBox.classList.add('open');

            const fotos = document.querySelectorAll('.photo');
            const widthPantalla = window.innerWidth;
            const heightPantalla = window.innerHeight;

            // BREVE DELAY INICIAL: Espera 500ms (medio segundo) después de abrir la tapa para lanzar las fotos
            setTimeout(() => {
                fotos.forEach((foto, index) => {
                    setTimeout(() => {
                        const randomX = Math.floor(Math.random() * (widthPantalla - 130)) + 10;
                        const randomY = Math.floor(Math.random() * (heightPantalla - 160)) + 10;
                        const randomRot = Math.floor(Math.random() * 30) - 15; 

                        foto.style.left = `${randomX}px`;
                        foto.style.top = `${randomY}px`;
                        foto.style.transform = `scale(1) rotate(${randomRot}deg)`;
                        foto.style.zIndex = index + 1;
                    }, index * 200); // Espaciado entre cada foto
                });
            }, 500); 

            // El texto inicia después de que se abra la tapa, el delay inicial y salgan todas las fotos
            setTimeout(() => {
                let i = 0;
                function escribir() {
                    if (i < textoSorpresa.length) {
                        textElement.textContent += textoSorpresa.charAt(i);
                        i++;
                        setTimeout(escribir, 50); 
                    }
                }
                escribir();
            }, 500 + (fotos.length * 200) + 300);
        });
    </script>

</body>
</html>
