<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Sorpresa de Cumpleaños!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
            perspective: 1000px;
        }

        /* Contenedor del Regalo */
        .gift-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .gift-container:hover {
            transform: scale(1.05);
        }

        /* La Caja (Cuerpo) */
        .box-body {
            position: absolute;
            bottom: 0;
            width: 200px;
            height: 160px;
            background: #ff4757;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Cinta Vertical de la Caja */
        .box-body::after, .box-lid::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 100%;
            background: #ffa502;
        }

        /* La Tapa */
        .box-lid {
            position: absolute;
            top: 15px;
            left: -5px;
            width: 210px;
            height: 40px;
            background: #ff6b81;
            border-radius: 4px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            z-index: 2;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: left top;
        }

        /* El Lazo */
        .box-bow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 20px;
            background: #ffa502;
            border-radius: 50% 50% 0 0;
        }

        /* --- ESTADO ABIERTO (TAPA) --- */
        .gift-container.open .box-lid {
            transform: rotate(-120deg) translateY(-30px);
        }

        /* --- CONTENIDO DE FOTOS --- */
        .photo-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* No estorba al clic de la caja inicialmente */
        }

        .photo {
            position: absolute;
            width: 140px;
            height: 160px;
            background: white;
            padding: 8px;
            padding-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border-radius: 2px;
            left: 30px;
            top: 20px;
            opacity: 0;
            transform: scale(0.2);
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), 
                        top 1s cubic-bezier(0.25, 1, 0.5, 1), 
                        left 1s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.5s ease;
            z-index: 10;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1px solid #ddd;
        }

        /* Cuando la caja se abre, las fotos se vuelven interactivas */
        .gift-container.open .photo {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- CONTENEDOR DEL TEXTO --- */
        .message-container {
            position: absolute;
            bottom: 40px;
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }

        .message {
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.85);
            display: inline-block;
            white-space: pre-line; /* Mantiene los saltos de línea */
        }

        /* Cursor parpadeante de la máquina de escribir */
        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #ffa502;
            margin-left: 5px;
            animation: blink 0.6s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="gift-container" id="giftBox">
        <div class="box-lid">
            <div class="box-bow"></div>
        </div>
        <div class="box-body"></div>
        
        <div class="photo-container">
            <div class="photo" id="p1"><img src="https://via.placeholder.com/150/FF0000/FFFFFF?text=Foto+1" alt="1"></div>
            <div class="photo" id="p2"><img src="https://via.placeholder.com/150/00FF00/FFFFFF?text=Foto+2" alt="2"></div>
            <div class="photo" id="p3"><img src="https://via.placeholder.com/150/0000FF/FFFFFF?text=Foto+3" alt="3"></div>
            <div class="photo" id="p4"><img src="https://via.placeholder.com/150/FFFF00/FFFFFF?text=Foto+4" alt="4"></div>
            <div class="photo" id="p5"><img src="https://via.placeholder.com/150/FF00FF/FFFFFF?text=Foto+5" alt="5"></div>
            <div class="photo" id="p6"><img src="https://via.placeholder.com/150/00FFFF/FFFFFF?text=Foto+6" alt="6"></div>
            <div class="photo" id="p7"><img src="https://via.placeholder.com/150/FFA500/FFFFFF?text=Foto+7" alt="7"></div>
        </div>
    </div>

    <div class="message-container">
        <span class="message" id="typewriter"></span><span class="cursor" id="cursor"></span>
    </div>

    <script>
        const giftBox = document.getElementById('giftBox');
        const textElement = document.getElementById('typewriter');
        const cursor = document.getElementById('cursor');

        // Texto que se va a escribir solo (Usa \n para saltos de línea)
        const textoSorpresa = "¡Feliz Cumpleaños, Loco! 💀🔥\nQue la pases criminal hoy.\n¡Disfruta tu día al máximo!";
        
        let yaAbierto = false;

        giftBox.addEventListener('click', () => {
            // Solo ejecuta la animación la primera vez que se toca
            if (yaAbierto) return; 
            yaAbierto = true;

            giftBox.classList.add('open');

            // 1. Desordenar y regar las fotos por toda la pantalla
            const fotos = document.querySelectorAll('.photo');
            
            fotos.forEach((foto, index) => {
                // Cálculo para que salgan en orden escalonado (delay)
                setTimeout(() => {
                    // Genera posiciones aleatorias en la pantalla
                    const randomX = Math.floor(Math.random() * (window.innerWidth - 160));
                    const randomY = Math.floor(Math.random() * (window.innerHeight - 200));
                    // Rotación aleatoria para el toque Polaroid
                    const randomRot = Math.floor(Math.random() * 40) - 20; 

                    foto.style.top = `${randomY}px`;
                    foto.style.left = `${randomX}px`;
                    foto.style.transform = `scale(1) rotate(${randomRot}deg)`;
                    foto.style.zIndex = index + 1;
                }, index * 250); // Ajusta este número (250) si quieres que salgan más rápido o lento
            });

            // 2. Iniciar efecto máquina de escribir después de que salgan las fotos
            setTimeout(() => {
                let i = 0;
                function escribir() {
                    if (i < textoSorpresa.length) {
                        textElement.textContent += textoSorpresa.charAt(i);
                        i++;
                        setTimeout(escribir, 60); // Velocidad de escritura (en milisegundos)
                    } else {
                        // Deja el cursor fijo o puedes ocultarlo al terminar
                        cursor.style.display = 'inline-block';
                    }
                }
                escribir();
            }, fotos.length * 250 + 500); // Arranca justo al terminar las fotos
        });
    </script>

</body>
                </html>
