<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo Wiki | Versión Blindada</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc;
            --html: #ef4444; --css: #3b82f6; --js: #eab308;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; }
        
        .header-section { text-align: center; margin-bottom: 30px; }
        .search-bar { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #334155; background: var(--card); color: white; font-size: 1rem; margin-bottom: 20px; outline: none; }

        details { background: rgba(30, 41, 59, 0.5); border-radius: 15px; margin-bottom: 15px; border: 1px solid #334155; }
        summary { padding: 20px; font-size: 1.2rem; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::after { content: '▶'; font-size: 0.8rem; transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(90deg); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; }

        .tile {
            background: var(--bg); aspect-ratio: 1 / 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; border-radius: 15px;
            cursor: pointer; transition: all 0.3s; border: 1px solid #334155;
            text-align: center; padding: 15px; box-sizing: border-box;
        }
        .tile:hover { transform: scale(1.05); border-color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .tile b { font-size: 1.1rem; color: #fff; margin-bottom: 5px; display: block; }
        .tile span { font-size: 0.75rem; opacity: 0.8; line-height: 1.2; }

        .html-t { border-bottom: 5px solid var(--html); }
        .css-t { border-bottom: 5px solid var(--css); }
        .js-t { border-bottom: 5px solid var(--js); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; backdrop-filter: blur(5px); }
        .modal-content { background: #1e293b; width: 100%; max-width: 500px; border-radius: 20px; padding: 30px; position: relative; border: 1px solid #475569; }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 2rem; color: #94a3b8; }
        .example-box { background: #0f172a; padding: 20px; border-radius: 12px; margin-top: 15px; color: #38bdf8; font-family: monospace; white-space: pre-wrap; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>LOBO WIKI 🐺</h1>
        <input type="text" id="search" class="search-bar" placeholder="🔍 Buscar...">
    </div>

    <details open>
        <summary style="color: var(--html);">🧱 HTML (Estructura)</summary>
        <div class="grid" id="html-grid"></div>
    </details>

    <details>
        <summary style="color: var(--css);">🎨 CSS (Diseño)</summary>
        <div class="grid" id="css-grid"></div>
    </details>

    <details>
        <summary style="color: var(--js);">⚡ JS (Lógica)</summary>
        <div class="grid" id="js-grid"></div>
    </details>
</div>

<div class="modal" id="modal" onclick="if(event.target == this) closeModal()">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">×</span>
        <h3 id="m-title" style="margin:0; color:#fff;"></h3>
        <p id="m-desc" style="color:#94a3b8;"></p>
        <div class="example-box" id="m-code"></div>
    </div>
</div>

    function render() {
        const createGrid = (id, list, type) => {
            const container = document.getElementById(id);
            container.innerHTML = ""; 
            
            list.forEach(item => {
                const tile = document.createElement("div");
                tile.className = `tile ${type}-t`;
                
                const title = document.createElement("b");
                title.innerText = item.t;
                
                const desc = document.createElement("span");
                desc.innerText = item.d;
                
                tile.appendChild(title);
                tile.appendChild(desc);
                
                tile.addEventListener('click', () => {
                    showModal(item.t, item.d, item.e);
                });
                
                container.appendChild(tile);
            });
        };

        createGrid('html-grid', wikiData.html, 'html');
        createGrid('css-grid', wikiData.css, 'css');
        createGrid('js-grid', wikiData.js, 'js');
    }

    function showModal(title, desc, code) {
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-desc').innerText = desc;
        document.getElementById('m-code').innerText = code;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    document.getElementById('search').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('details').forEach(det => {
            const hasMatch = det.innerText.toLowerCase().includes(val);
            if (val.length > 0 && hasMatch) det.open = true;
        });
        document.querySelectorAll('.tile').forEach(t => {
            t.style.display = t.innerText.toLowerCase().includes(val) ? "flex" : "none";
        });
    };

    render();
</script>
