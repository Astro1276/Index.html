<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobo Wiki Total | Enciclopedia</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent-html: #ef4444;
            --accent-css: #3b82f6;
            --accent-js: #eab308;
            --text: #f8fafc;
            --border: #334155;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px;
        }
        .container { max-width: 1000px; margin: auto; }
        
        .search-box {
            width: 100%; padding: 15px; margin-bottom: 25px;
            border-radius: 10px; border: 1px solid var(--border);
            background: var(--card); color: white; font-size: 1rem;
        }

        /* Contenedor de Categoría */
        .category-block {
            background: var(--card);
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .category-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            font-weight: bold;
            border-bottom: 1px solid var(--border);
        }

        /* EL GRID (Igual para todos) */
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        /* Estilo de los Cuadritos (Cards) */
        .item-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ccc;
            transition: transform 0.2s;
        }
        .item-card:hover { transform: translateY(-3px); }
        
        .item-card code {
            display: block;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }
        .item-card p {
            margin: 0;
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* Colores */
        .html-card { border-left-color: var(--accent-html); }
        .css-card { border-left-color: var(--accent-css); }
        .js-card { border-left-color: var(--accent-js); }

        .badge {
            font-size: 0.7rem; padding: 3px 8px;
            border-radius: 4px; text-transform: uppercase;
        }
        .bg-html { background: var(--accent-html); }
        .bg-css { background: var(--accent-css); }
        .bg-js { background: var(--accent-js); }
    </style>
</head>
<body>

<div class="container">
    <input type="text" id="search" class="search-box" placeholder="🔍 Buscar en la enciclopedia (ej: 'flex', 'div', 'fetch')...">

    <div class="category-block">
        <div class="category-header">
            <span>🧱 HTML5 (Estructura)</span>
            <span class="badge bg-html">Esqueleto</span>
        </div>
        <div class="grid-layout" id="html-grid"></div>
    </div>

    <div class="category-block">
        <div class="category-header">
            <span>🎨 CSS3 (Diseño)</span>
            <span class="badge bg-css">Estilo</span>
        </div>
        <div class="grid-layout" id="css-grid"></div>
    </div>

    <div class="category-block">
        <div class="category-header">
            <span>⚡ JavaScript (Acción)</span>
            <span class="badge bg-js">Cerebro</span>
        </div>
        <div class="grid-layout" id="js-grid"></div>
    </div>
</div>

<script>
    const database = {
        html: [
            { t: "<div>", d: "Contenedor genérico para agrupar elementos." },
            { t: "<a>", d: "Enlace o hipervínculo a otra página." },
            { t: "<img>", d: "Inserta una imagen en el documento." },
            { t: "<form>", d: "Crea una sección para recolectar datos." },
            { t: "<input>", d: "Campo donde el usuario escribe datos." },
            { t: "<ul> / <li>", d: "Listas con puntos (desordenadas)." },
            { t: "<h1> - <h6>", d: "Títulos de mayor a menor importancia." },
            { t: "<button>", d: "Botón clickeable para ejecutar acciones." },
            { t: "<section>", d: "Define una sección temática en la web." },
            { t: "<iframe>", d: "Incrusta otra página dentro de la tuya." }
        ],
        css: [
            { t: "display: flex", d: "Alinea elementos de forma flexible." },
            { t: "grid-template", d: "Crea rejillas complejas de columnas." },
            { t: "position", d: "Controla el lugar (static, absolute, relative)." },
            { t: "border-radius", d: "Redondea las esquinas de los cuadros." },
            { t: "background", d: "Define el color o imagen de fondo." },
            { t: "box-shadow", d: "Agrega sombras a los elementos." },
            { t: "animation", d: "Aplica movimientos suaves a los objetos." },
            { t: "media-queries", d: "Hace que la web se adapte a celulares." },
            { t: "z-index", d: "Define qué elemento va encima de otro." },
            { t: "transition", d: "Controla la velocidad de los cambios." }
        ],
        js: [
            { t: "fetch()", d: "Obtiene datos desde servidores o APIs." },
            { t: "querySelector()", d: "Busca un elemento HTML para usarlo." },
            { t: "addEventListener", d: "Detecta clicks, teclas o movimientos." },
            { t: "localStorage", d: "Guarda datos de forma permanente." },
            { t: "array.map()", d: "Transforma una lista de datos en otra." },
            { t: "async / await", d: "Maneja procesos que tardan tiempo." },
            { t: "JSON.parse()", d: "Convierte texto en objeto de datos." },
            { t: "classList.toggle", d: "Prende o apaga una clase CSS." },
            { t: "setInterval()", d: "Repite un código cada X segundos." },
            { t: "const / let", d: "Crea variables para guardar datos." }
        ]
    };

    function init() {
        const fill = (id, data, type) => {
            const el = document.getElementById(id);
            el.innerHTML = data.map(i => `
                <div class="item-card ${type}-card">
                    <code>${i.t}</code>
                    <p>${i.d}</p>
                </div>
            `).join('');
        };
        fill('html-grid', database.html, 'html');
        fill('css-grid', database.css, 'css');
        fill('js-grid', database.js, 'js');
    }

    document.getElementById('search').oninput = (e) => {
        const val = e.target.value.toLowerCase();
        document.querySelectorAll('.item-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(val) ? "block" : "none";
        });
    };

    init();
</script>
</body>
</html>
